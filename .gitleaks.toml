title = "DailyXP Gitleaks Config"

[[rules]]
id = "firebase-web-api-key"
description = "Firebase Web API Key"
regex = '''(?i)AIza[0-9A-Za-z-_]{35}'''
severity = "high"

[[rules]]
id = "generic-api-key"
description = "Generic API key patterns"
regex = '''(?i)(api[_-]?key|access[_-]?key|secret|token)[^\n]{0,20}[:=][^\n]{0,200}'''
entropy = 3.5
tags = ["generic", "apikey"]

[allowlist]
description = "Allow common directories that may contain false positives"
paths = [
  '^\.git/',
  '^build/',
  '^\.dart_tool/',
  '^ios/Pods/',
  '^android/\.gradle/',
  "(^|.*/)?Podfile\\.lock$",
  "(^|.*/)?android/gradle\\.lockfile$",
]
