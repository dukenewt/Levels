name: Security Check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret and Sensitive File Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate no sensitive files are committed
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanning for forbidden file patterns..."
          # Comprehensive patterns of files/paths that must never be committed
          # Derived from repository security policy and .gitignore guidance
          PATTERN_REGEX='(^|/)(
            # Firebase client configs
            GoogleService-Info\.plist|
            google-services\.json|
            firebase_options\.dart|
            firebase_config\.swift|
            firebase\.json|
            
            # Environment and secrets
            \.env(\..*)?$|[^/]*\.env$|
            secrets\.json|config\.json|
            secrets/|private_keys/|
            [^/]*_secret\.[^/]+|[^/]*_key\.[^/]+|
            api_keys\.dart|keys\.dart|credentials\.dart|
            
            # Keystores and signing
            android/[^/]*/keystore[^/]*|[^/]*\.jks|[^/]*\.p12$|[^/]*\.mobileprovision$|
            
            # Build artifacts and generated files
            build/|\.dart_tool/|\.pub-cache/|android/build/|android/\.gradle/|android/app/build/|ios/build/|ios/Pods/|
            ios/Runner\.xcworkspace/|ios/Runner\.xcodeproj/|
            
            # IDE and system files
            \.vscode/|\.idea/|[^/]*\.iml|\.DS_Store|[^/]*\.log|
            
            # Temp and cache
            \.?tmp/|tmp/|cache/|\.cache/|
            
            # User data and databases
            [^/]*\.sqlite|database\.db|user_data/|
            
            # Sensitive media
            sensitive_images/|private_media/|
            
            # Lockfiles
            pubspec\.lock
          )'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags --prune --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            CHANGED=$(git diff --name-only "$BASE"...HEAD)
          else
            CHANGED=$(git ls-files)
          fi

          echo "$CHANGED" | tr ' ' '\n' | grep -E -i "$PATTERN_REGEX" && {
            echo "Error: Sensitive configuration detected in commit or repo tree." >&2
            exit 1
          } || echo "No forbidden files detected."

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2

      - name: TruffleHog scan (full repo)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
