name: Security Check

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  forbidden-paths:
    name: Guard Forbidden Paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine diff range
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.base_ref }}" >> $GITHUB_OUTPUT
            echo "range=origin/${{ github.base_ref }}...HEAD" >> $GITHUB_OUTPUT
          else
            echo "base=$(git rev-parse HEAD~1)" >> $GITHUB_OUTPUT
            echo "range=HEAD~1..HEAD" >> $GITHUB_OUTPUT
          fi

      - name: Check for forbidden paths
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/forbidden-paths.txt ]; then
            echo "scripts/forbidden-paths.txt missing" >&2
            exit 1
          fi
          changed=$(git diff --name-only ${{ steps.diff.outputs.range }} || true)
          if [ -z "$changed" ]; then
            echo "No changed files in range"
            exit 0
          fi
          echo "Changed files:" && echo "$changed"
          echo "$changed" > /tmp/changed.txt
          # Build a single regex from patterns file (one per line)
          regex=$(awk 'NF && $0 !~ /^#/ { if (n) printf("|"); printf("(%s)", $0) ; n=1 }' scripts/forbidden-paths.txt)
          if [ -z "$regex" ]; then
            echo "No patterns in scripts/forbidden-paths.txt" >&2
            exit 1
          fi
          echo "Using regex: $regex"
          if grep -E "$regex" /tmp/changed.txt > /tmp/matches.txt; then
            echo "Forbidden paths touched:" >&2
            cat /tmp/matches.txt >&2
            exit 1
          else
            echo "No forbidden paths in change set."
          fi

  secret-scans:
    name: Secret Scans (Gitleaks & TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --no-git -v

      - name: TruffleHog Scan
        run: |
          pip install trufflehog
          trufflehog filesystem --no-update --only-verified .
