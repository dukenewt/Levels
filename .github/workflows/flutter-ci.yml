name: Flutter CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-test:
    name: Format, Analyze, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Stub Firebase options for CI builds
        run: |
          mkdir -p lib
          cat > lib/firebase_options.dart << 'EOF'
          import 'package:firebase_core/firebase_core.dart';
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
              apiKey: 'test',
              appId: 'test',
              messagingSenderId: 'test',
              projectId: 'test',
            );
          }
          EOF

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Determine changed Dart files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            lib/**/*.dart
            test/**/*.dart
            integration_test/**/*.dart

      - name: Format Check (changed files)
        if: ${{ steps.changed.outputs.all_changed_files != '' }}
        run: |
          echo "Checking formatting for changed Dart files..."
          dart format --set-exit-if-changed ${{ steps.changed.outputs.all_changed_files }}
      - name: No Dart file changes to format
        if: ${{ steps.changed.outputs.all_changed_files == '' }}
        run: echo "No changed Dart files to format."

      - name: Analyze (full, non-blocking)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: flutter analyze

      - name: Analyze changed files (PRs only, blocking; ignore warnings/infos)
        if: ${{ github.event_name == 'pull_request' && steps.changed.outputs.all_changed_files != '' }}
        run: |
          echo "Changed Dart files: ${{ steps.changed.outputs.all_changed_files }}"
          flutter analyze --no-fatal-warnings --no-fatal-infos ${{ steps.changed.outputs.all_changed_files }}
      - name: No Dart file changes detected
        if: ${{ steps.changed.outputs.all_changed_files == '' }}
        run: echo "No changed Dart files to analyze."

      - name: Prepare test asset directories
        run: |
          mkdir -p assets/animations
          mkdir -p assets/images
          mkdir -p assets/fonts
          echo "Ensured asset directories exist for test bundling."

      - name: Unit Tests (changed files only)
        if: ${{ steps.changed.outputs.all_changed_files != '' }}
        run: flutter test --no-pub
      - name: No Dart file changes to test
        if: ${{ steps.changed.outputs.all_changed_files == '' }}
        run: echo "No changed Dart files to test. Skipping flutter test."

      # Optional: Uncomment to build Android on CI (heavier)
      # - name: Build Android APK (optional)
      #   run: flutter build apk --debug
