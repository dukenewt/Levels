name: Flutter CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-test:
    name: Format, Analyze, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Format Check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Unit Tests
        run: flutter test --no-pub

      # Optional: Uncomment to build Android on CI (heavier)
      # - name: Build Android APK (optional)
      #   run: flutter build apk --debug

