name: Flutter CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-test:
    name: Format, Analyze, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Format Check
        run: |
          set -e
          echo "Checking Dart formatting..."
          # Show files that would be changed and fail if any are unformatted
          dart format --output=show --set-exit-if-changed . || {
            echo "\nFormatting changes detected. To fix locally, run:";
            echo "  dart format .";
            exit 1;
          }

      - name: Analyze
        run: flutter analyze

      - name: Unit Tests
        run: flutter test --no-pub

      # Optional: Uncomment to build Android on CI (heavier)
      # - name: Build Android APK (optional)
      #   run: flutter build apk --debug
